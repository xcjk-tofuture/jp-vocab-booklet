  <script>
  (()=>{
    const data=JSON.parse(document.getElementById('vocab-data').textContent);
    const names=['名词','形容词','副词','感叹词','其他','动词'];
    const $=id=>document.getElementById(id);
    const tabs=$('tabs'),head=$('table-head'),body=$('table-body');
    const size=50;
    const bookmarkKey='vocab-bookmark-v1';
    const markedWordsKey='vocab-marked-words-v1';
    function readMarkedWords(){try{const saved=JSON.parse(localStorage.getItem(markedWordsKey));if(Array.isArray(saved))return new Set(saved.filter(key=>typeof key==='string'))}catch{}return new Set()}
    const markedWords=readMarkedWords();
    function readBookmark(){try{const saved=JSON.parse(localStorage.getItem(bookmarkKey));if(names.includes(saved?.category)&&Number.isInteger(saved.page)&&saved.page>=0){return {category:saved.category,page:Math.min(saved.page,Math.max(0,Math.ceil(data[saved.category].length/size)-1))}}}catch{}return null}
    let bookmark=readBookmark();
    let category=bookmark?.category||(names.includes(localStorage.getItem('vocab-category'))?localStorage.getItem('vocab-category'):'名词');
    let page=bookmark?.page||0;
    const hidden={jp:false,reading:false,meaning:false};
    let revealed=new Set();
    function el(tag,className,value){const e=document.createElement(tag);if(className)e.className=className;if(value!==undefined)e.textContent=value;return e}
    function makeCell(row,column,text){
      const td=el('td','answer-cell '+column);
      const span=el('span',column==='jp'?'jp':column==='reading'?'reading':'meaning',text);
      if(hidden[column]&&!revealed.has(row+'-'+column)){span.classList.add('hidden-answer');td.title='点击显示这一格'}
      td.append(span);td.onclick=()=>{const key=row+'-'+column;if(revealed.has(key))revealed.delete(key);else revealed.add(key);renderRows()};
      return {td,span};
    }
    function renderTabs(){tabs.replaceChildren();for(const name of names){const b=el('button','tab',`${name} ${data[name].length}`);b.type='button';b.setAttribute('aria-selected',String(name===category));b.onclick=()=>{category=name;page=0;revealed.clear();localStorage.setItem('vocab-category',name);render();b.scrollIntoView({block:'nearest',inline:'nearest'})};tabs.append(b)}}
    function renderRows(){
      body.replaceChildren();const entries=data[category],start=page*size,end=Math.min(start+size,entries.length),verb=category==='动词';
      if(!entries.length){const tr=el('tr');const td=el('td','empty','暂无词条');td.colSpan=3;tr.append(td);body.append(tr);return}
      for(let i=start;i<end;i++){
        const item=entries[i],tr=el('tr');const first=makeCell(i,'jp',item[0]);first.td.prepend(el('span','number',String(i+1)));
        const markKey=JSON.stringify([category,i,item[0]]),mark=el('button','word-mark');mark.type='button';
        function updateMark(){const saved=markedWords.has(markKey);mark.textContent=saved?'★':'☆';mark.setAttribute('aria-pressed',String(saved));mark.setAttribute('aria-label',`${saved?'取消标记':'标记'}${item[0]}`);mark.title=saved?'取消标记':'标记这个词'}
        updateMark();mark.onclick=event=>{event.stopPropagation();if(markedWords.has(markKey))markedWords.delete(markKey);else markedWords.add(markKey);localStorage.setItem(markedWordsKey,JSON.stringify([...markedWords]));updateMark()};first.span.after(mark);
        if(verb){const dict=el('span','dict','→ '+item[1]);if(hidden.jp&&!revealed.has(i+'-jp'))dict.classList.add('hidden-answer');first.td.append(dict)}
        const second=makeCell(i,'reading',verb?item[2]:item[1]);
        const third=makeCell(i,'meaning',verb?item[3]:item[2]);
        if(verb&&item[4]){
          const usage=el('span','phrase',item[4]);
          if(item[5])usage.append(el('span','badge',item[5]));
          third.span.append(usage);
        }
        tr.append(first.td,second.td,third.td);body.append(tr)
      }
    }
    function render(){
      renderTabs();document.body.classList.toggle('verb-view',category==='动词');
      head.replaceChildren();const tr=el('tr');for(const label of category==='动词'?['ます形 → 辞書形','辞書形读音','中文 · 用法']:['日语写法','分字读音','中文']){tr.append(el('th','',label))}head.append(tr);
      const total=data[category].length,pages=Math.ceil(total/size);page=Math.max(0,Math.min(page,Math.max(0,pages-1)));
      $('status').innerHTML=`<strong>${category}</strong> · 共 ${total} 词`;
      $('page-status').textContent=total?`${page*size+1}–${Math.min((page+1)*size,total)} / ${total}`:'0 / 0';
      $('pager-status').textContent=`第 ${page+1} / ${Math.max(pages,1)} 页`;
      $('prev').disabled=page===0;$('next').disabled=page>=pages-1;
      $('jump-page').max=Math.max(pages,1);$('jump-page').value=page+1;
      const marked=bookmark?.category===category&&bookmark.page===page;
      $('bookmark').setAttribute('aria-pressed',String(marked));$('bookmark').textContent=marked?'取消此页标记':'标记此页';
      $('go-bookmark').disabled=!bookmark||marked;
      $('bookmark-status').textContent=bookmark?`已标记：${bookmark.category} · 第 ${bookmark.page+1} 页；下次打开从这里继续`:'尚未标记继续阅读的位置';
      for(const key of Object.keys(hidden)){$('hide-'+key).setAttribute('aria-pressed',String(hidden[key]));$('hide-'+key).textContent=hidden[key]?'显示'+({jp:'日语',reading:'读音',meaning:'中文'}[key]):'遮住'+({jp:'日语',reading:'读音',meaning:'中文'}[key])}
      renderRows()
    }
    for(const key of Object.keys(hidden))$('hide-'+key).onclick=()=>{hidden[key]=!hidden[key];revealed.clear();render()};
    $('show-all').onclick=()=>{for(const key of Object.keys(hidden))hidden[key]=false;revealed.clear();render()};
    function goToPage(target,targetCategory=category){if(target<0||target>=Math.ceil(data[targetCategory].length/size))return;category=targetCategory;page=target;revealed.clear();localStorage.setItem('vocab-category',category);render();window.scrollTo({top:0,behavior:'auto'})}
    function turn(delta){goToPage(page+delta)}
    $('prev').onclick=()=>turn(-1);$('next').onclick=()=>turn(1);
    function jump(){const input=$('jump-page'),target=Number(input.value);if(!Number.isInteger(target)||target<1||target>Math.ceil(data[category].length/size)){input.setCustomValidity(`请输入 1 到 ${Math.ceil(data[category].length/size)} 之间的页码`);input.reportValidity();input.setCustomValidity('');return}goToPage(target-1)}
    $('jump').onclick=jump;$('jump-page').onkeydown=e=>{if(e.key==='Enter')jump()};
    $('bookmark').onclick=()=>{const marked=bookmark?.category===category&&bookmark.page===page;bookmark=marked?null:{category,page};if(bookmark)localStorage.setItem(bookmarkKey,JSON.stringify(bookmark));else localStorage.removeItem(bookmarkKey);render()};
    $('go-bookmark').onclick=()=>{if(bookmark)goToPage(bookmark.page,bookmark.category)};
    render();
  })();
